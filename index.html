<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>บันทึกค่าใช้จ่าย</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f1ec;--card:#fffefb;--ink:#1d2a2f;--mute:#6b777b;--line:#ddd8cd;--accent:#0f6b5c;--warn:#b3401f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "IBM Plex Sans Thai",system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 80px}
h1{font-size:1.5rem;margin:0 0 16px;font-weight:700}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:16px}
summary{cursor:pointer;font-weight:500}
label{display:block;font-size:.85rem;color:var(--mute);margin-top:12px}
input{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 14px}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:500;width:100%;margin-top:18px;padding:12px}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.small{font-size:.85rem;color:var(--mute)}
.drop{border:2px dashed var(--line);border-radius:10px;padding:18px;text-align:center;cursor:pointer;background:#fff;margin-top:6px}
.files{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.chip{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px;background:#fff;max-width:100%}
.chip img,.chip .pdf{width:48px;height:48px;object-fit:cover;border-radius:6px;background:#eee;display:grid;place-items:center;font-size:.75rem;font-weight:700;color:var(--warn)}
.chip span{font-size:.8rem;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip button{padding:2px 8px}
#msg{margin-top:12px;font-size:.9rem}
.ok{color:var(--accent)}.err{color:var(--warn)}
.hist div{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:.9rem}
</style>
</head>
<body>
<div class="wrap">
<h1>บันทึกค่าใช้จ่าย</h1>

<details class="panel" id="settings">
  <summary>ตั้งค่า</summary>
  <label for="url">Web App URL (จาก Apps Script)</label>
  <input id="url" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off">
  <label for="key">รหัสลับ (ตรงกับ SECRET ใน Code.gs)</label>
  <input id="key" type="password" autocomplete="off">
</details>

<div class="panel">
  <label for="title" style="margin-top:0">หัวข้อ</label>
  <input id="title" placeholder="เช่น ค่าอาหารกลางวัน">
  <label for="amount">จำนวนเงิน (บาท)</label>
  <input id="amount" inputmode="decimal" placeholder="0.00">
  <label for="date">วันที่</label>
  <input id="date" type="date">
  <label>แนบไฟล์ (รูปภาพหรือ PDF สูงสุด 2 ไฟล์)</label>
  <div class="drop" id="drop" tabindex="0" role="button">แตะเพื่อเลือกไฟล์ / ถ่ายรูป</div>
  <input id="file" type="file" accept="image/*,application/pdf" multiple hidden>
  <div class="files" id="files"></div>
  <button class="primary" id="send">บันทึกลง Google Sheet</button>
  <div id="msg" role="status"></div>
</div>

<div class="panel hist" id="hist" hidden><strong>บันทึกแล้วในรอบนี้</strong></div>
</div>

<script>
const $=s=>document.querySelector(s);
const store={get:k=>{try{return localStorage.getItem(k)||''}catch(e){return''}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
let files=[];
$('#date').value=today();
$('#url').value=store.get('ex_url');$('#key').value=store.get('ex_key');
if(!$('#url').value)$('#settings').open=true;
$('#url').onchange=e=>store.set('ex_url',e.target.value.trim());
$('#key').onchange=e=>store.set('ex_key',e.target.value.trim());
const msg=(t,c)=>{$('#msg').textContent=t;$('#msg').className=c||''};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');

const b64=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(',')[1]);f.readAsDataURL(b)});
const toBlob=(img,max,q)=>new Promise(r=>{const k=Math.min(1,max/Math.max(img.width,img.height));
  const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  c.toBlob(b=>r({blob:b,w:c.width,h:c.height}),'image/jpeg',q)});
function shrink(file){return new Promise((res,rej)=>{
  const img=new Image(),u=URL.createObjectURL(file);
  img.onload=async()=>{const m=await toBlob(img,1600,.82),t=await toBlob(img,800,.75);URL.revokeObjectURL(u);res({...m,thumb:t})};
  img.onerror=()=>rej(new Error('เปิดรูปไม่ได้'));img.src=u;})}

async function addFiles(list){
  for(const f of [...list]){
    if(files.length>=2){msg('แนบได้สูงสุด 2 ไฟล์','err');break}
    try{
      if(f.type==='application/pdf'){
        if(f.size>7e6)throw new Error('PDF ใหญ่เกิน 7 MB');
        files.push({name:f.name,type:f.type,data:await b64(f),isPdf:true});
      }else if(f.type.startsWith('image/')){
        const s=await shrink(f);
        files.push({name:f.name.replace(/\.[^.]+$/,'')+'.jpg',type:'image/jpeg',data:await b64(s.blob),w:s.w,h:s.h,thumb:await b64(s.thumb.blob),tw:s.thumb.w,th:s.thumb.h,url:URL.createObjectURL(s.blob)});
      }
    }catch(e){msg(e.message,'err')}
  }
  renderFiles();
}
function renderFiles(){
  $('#files').innerHTML=files.map((f,i)=>`<div class="chip">${f.isPdf?'<div class="pdf">PDF</div>':`<img src="${f.url}" alt="">`}<span>${esc(f.name)}</span><button data-i="${i}" aria-label="ลบไฟล์">✕</button></div>`).join('');
}
$('#files').onclick=e=>{const i=e.target.dataset.i;if(i!==undefined){files.splice(+i,1);renderFiles()}};
$('#drop').onclick=()=>$('#file').click();
$('#drop').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('#file').click()}};
$('#file').onchange=e=>{addFiles(e.target.files);e.target.value=''};

$('#send').onclick=async()=>{
  const title=$('#title').value.trim(),amount=$('#amount').value.replace(/,/g,''),date=$('#date').value,url=$('#url').value.trim();
  if(!url){$('#settings').open=true;return msg('ใส่ Web App URL ในช่องตั้งค่าก่อน','err')}
  if(!title)return msg('กรอกหัวข้อ','err');
  if(!(parseFloat(amount)>=0)||amount==='')return msg('กรอกจำนวนเงินให้ถูกต้อง','err');
  if(!date)return msg('เลือกวันที่','err');
  $('#send').disabled=true;msg('กำลังบันทึก อาจใช้เวลาสักครู่…');
  try{
    const r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({key:$('#key').value.trim(),title,amount,date,files:files.map(({name,type,data,w,h,thumb,tw,th})=>({name,type,data,w,h,thumb,tw,th}))})});
    const j=await r.json();
    if(!j.ok)throw new Error(j.error||'บันทึกไม่สำเร็จ');
    msg('บันทึกแล้ว (แถวที่ '+j.row+')','ok');
    $('#hist').hidden=false;
    $('#hist').insertAdjacentHTML('beforeend',`<div><span>${esc(title)}</span><span>${parseFloat(amount).toLocaleString('th-TH',{minimumFractionDigits:2})} · ${date}</span></div>`);
    $('#title').value='';$('#amount').value='';files=[];renderFiles();
  }catch(e){msg(e.message==='Failed to fetch'?'เชื่อมต่อไม่ได้ ตรวจ URL และการ Deploy':e.message,'err')}
  $('#send').disabled=false;
};
</script>
</body>
</html>
