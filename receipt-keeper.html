<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สมุดใบเสร็จ</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f1ec;--card:#fffefb;--ink:#1d2a2f;--mute:#6b777b;--line:#ddd8cd;--accent:#0f6b5c;--accent-ink:#fff;--warn:#b3401f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "IBM Plex Sans Thai",system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 80px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:1.5rem;margin:0;font-weight:700}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:16px}
details summary{cursor:pointer;font-weight:500}
label{display:block;font-size:.85rem;color:var(--mute);margin-top:10px}
input,select{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.small{font-size:.85rem;color:var(--mute)}
.drop{border:2px dashed var(--line);border-radius:12px;padding:30px 16px;text-align:center;background:var(--card);cursor:pointer;margin-bottom:16px}
.drop.over{border-color:var(--accent);background:#eaf3f0}
.drop strong{display:block;font-size:1.1rem}
.item{display:grid;grid-template-columns:110px 1fr;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.item img{width:110px;height:150px;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:#eee}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.full{grid-column:1/-1}
.status{font-size:.85rem;margin-top:10px;color:var(--mute)}
.status.ok{color:var(--accent)} .status.err{color:var(--warn)}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.actions{display:flex;gap:8px;margin-top:12px;align-items:center}
a{color:var(--accent)}
@media(max-width:520px){.item{grid-template-columns:1fr}.item img{width:100%;height:180px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>สมุดใบเสร็จ</h1>
  <button id="connect" class="primary">เชื่อมต่อ Google</button>
</header>

<details class="panel" id="settings">
  <summary>ตั้งค่า</summary>
  <label for="cid">Google OAuth Client ID</label>
  <input id="cid" placeholder="xxxx.apps.googleusercontent.com" autocomplete="off">
  <label for="root">ชื่อโฟลเดอร์หลักใน Drive</label>
  <input id="root" value="ใบเสร็จ">
  <p class="small">ไฟล์จะถูกเก็บที่ <b>โฟลเดอร์หลัก / ปี / เดือน</b> ตามวันที่บนใบเสร็จ และบันทึกรายการลง Sheet "บันทึกใบเสร็จ" ในโฟลเดอร์หลัก </p>
</details>

<div class="drop" id="drop" tabindex="0" role="button">
  <strong>แนบรูปใบเสร็จ</strong>
  <span class="small">ลากไฟล์มาวาง หรือแตะเพื่อเลือก / ถ่ายรูป</span>
  <input id="file" type="file" accept="image/*" multiple hidden>
</div>

<div id="list"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
const SCOPE='https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/spreadsheets';
const CATS=['อาหาร','เดินทาง','ของใช้','สาธารณูปโภค','สุขภาพ','อื่นๆ'];
const $=s=>document.querySelector(s);
const store={get:k=>{try{return localStorage.getItem(k)||''}catch(e){return''}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let token='',tokenExp=0,items=[],uid=0;
const folderCache={};
$('#cid').value=store.get('rk_cid');
if(store.get('rk_root'))$('#root').value=store.get('rk_root');
if(!$('#cid').value)$('#settings').open=true;
$('#cid').onchange=e=>store.set('rk_cid',e.target.value.trim());
$('#root').onchange=e=>store.set('rk_root',e.target.value.trim());

/* ---------- Google auth ---------- */
function loadGsi(){return new Promise((res,rej)=>{if(window.google&&google.accounts)return res();const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=res;s.onerror=()=>rej(new Error('โหลด Google Sign-In ไม่ได้'));document.head.appendChild(s)})}
async function auth(){
  if(token&&Date.now()<tokenExp-60000)return token;
  const cid=$('#cid').value.trim();
  if(!cid){$('#settings').open=true;throw new Error('ใส่ Client ID ในช่องตั้งค่าก่อน');}
  await loadGsi();
  return new Promise((res,rej)=>{
    const tc=google.accounts.oauth2.initTokenClient({client_id:cid,scope:SCOPE,callback:r=>{
      if(r.error)return rej(new Error(r.error));
      token=r.access_token;tokenExp=Date.now()+r.expires_in*1000;
      $('#connect').textContent='เชื่อมต่อแล้ว';res(token);
    },error_callback:e=>rej(new Error(e.type||'ยกเลิกการเชื่อมต่อ'))});
    tc.requestAccessToken({prompt:token?'':'consent'});
  });
}
$('#connect').onclick=()=>auth().catch(e=>alert(e.message));
async function api(url,opt={}){
  const t=await auth();
  const r=await fetch(url,{...opt,headers:{Authorization:'Bearer '+t,...(opt.headers||{})}});
  if(!r.ok)throw new Error('Google API '+r.status+': '+(await r.text()).slice(0,160));
  return r.json();
}

/* ---------- Drive + Sheets ---------- */
async function ensureFolder(name,parent){
  const key=(parent||'root')+'/'+name;
  if(folderCache[key])return folderCache[key];
  const q=`name='${name.replace(/'/g,"\\'")}' and mimeType='application/vnd.google-apps.folder' and trashed=false`+(parent?` and '${parent}' in parents`:'');
  const found=await api('https://www.googleapis.com/drive/v3/files?fields=files(id)&q='+encodeURIComponent(q));
  let id=found.files[0]&&found.files[0].id;
  if(!id){
    const c=await api('https://www.googleapis.com/drive/v3/files?fields=id',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name,mimeType:'application/vnd.google-apps.folder',...(parent?{parents:[parent]}:{})})});
    id=c.id;
  }
  return folderCache[key]=id;
}
async function uploadImage(blob,name,parent){
  const fd=new FormData();
  fd.append('metadata',new Blob([JSON.stringify({name,parents:[parent]})],{type:'application/json'}));
  fd.append('file',blob);
  return api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,webViewLink',{method:'POST',body:fd});
}
async function ensureSheet(rootId){
  let id=store.get('rk_sheet_'+rootId);
  if(id)return id;
  const q=`name='บันทึกใบเสร็จ' and mimeType='application/vnd.google-apps.spreadsheet' and '${rootId}' in parents and trashed=false`;
  const f=await api('https://www.googleapis.com/drive/v3/files?fields=files(id)&q='+encodeURIComponent(q));
  if(f.files[0])id=f.files[0].id;
  else{
    const c=await api('https://www.googleapis.com/drive/v3/files?fields=id',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name:'บันทึกใบเสร็จ',mimeType:'application/vnd.google-apps.spreadsheet',parents:[rootId]})});
    id=c.id;
    await appendRow(id,['วันที่','ร้านค้า','ยอด (บาท)','หมวดหมู่','หมายเหตุ','ลิงก์รูป','บันทึกเมื่อ']);
  }
  store.set('rk_sheet_'+rootId,id);return id;
}
function appendRow(sheetId,row){
  return api(`https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/A1:append?valueInputOption=USER_ENTERED`,
    {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({values:[row]})});
}

/* ---------- Image + OCR ---------- */
function shrink(file,max=1800){
  return new Promise((res,rej)=>{
    const img=new Image(),u=URL.createObjectURL(file);
    img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas');c.width=img.width*k;c.height=img.height*k;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);
      c.toBlob(b=>res(b),'image/jpeg',.85)};
    img.onerror=()=>rej(new Error('เปิดรูปไม่ได้'));img.src=u;
  });
}
function parse(text){
  const lines=text.split(/\n/).map(s=>s.trim()).filter(Boolean);
  let date='',amount='',shop='';
  const m=text.match(/(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/)||null;
  const n=text.match(/(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/);
  let y,mo,d;
  if(m){y=+m[1];mo=+m[2];d=+m[3]}else if(n){d=+n[1];mo=+n[2];y=+n[3];if(y<100)y+=2000}
  if(y){if(y>2400)y-=543;if(mo>=1&&mo<=12&&d>=1&&d<=31)date=`${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`}
  const num=s=>{const r=[...s.matchAll(/\d{1,3}(?:,\d{3})*\.\d{2}|\d+\.\d{2}/g)].map(x=>parseFloat(x[0].replace(/,/g,'')));return r};
  for(const l of lines){if(/รวม|ยอด|total|amount|net|สุทธิ/i.test(l)){const r=num(l);if(r.length){amount=Math.max(...r);break}}}
  if(!amount){const all=num(text);if(all.length)amount=Math.max(...all)}
  shop=lines.find(l=>/[A-Za-z\u0E00-\u0E7F]{3,}/.test(l)&&!/\d{2}[\/-]\d{2}/.test(l))||'';
  return{date,amount:amount===''?'':String(amount),shop:shop.slice(0,60)};
}

/* ---------- UI ---------- */
function addFiles(files){[...files].filter(f=>f.type.startsWith('image/')).forEach(processFile)}
async function processFile(file){
  const it={id:++uid,status:'กำลังเตรียมรูป…',cls:'',pct:0,saved:false,blob:null,url:'',f:{date:'',shop:'',amount:'',cat:CATS[0],note:''}};
  items.unshift(it);render();
  try{
    it.blob=await shrink(file);it.url=URL.createObjectURL(it.blob);it.status='กำลังอ่านข้อความ…';render();
    const r=await Tesseract.recognize(it.blob,'tha+eng',{logger:m=>{if(m.status==='recognizing text'){it.pct=Math.round(m.progress*100);const b=document.querySelector(`[data-id="${it.id}"] .bar i`);if(b)b.style.width=it.pct+'%'}}});
    const p=parse(r.data.text);
    Object.assign(it.f,{date:p.date||new Date().toISOString().slice(0,10),shop:p.shop,amount:p.amount});
    it.status='อ่านเสร็จแล้ว ตรวจและแก้ไขก่อนบันทึก';it.cls='';it.pct=100;
  }catch(e){it.status='อ่านอัตโนมัติไม่สำเร็จ กรอกเองได้: '+e.message;it.cls='err';it.f.date=new Date().toISOString().slice(0,10);}
  render();
}
function render(){
  const focus=document.activeElement&&document.activeElement.dataset;
  $('#list').innerHTML=items.map(it=>`
  <div class="item" data-id="${it.id}">
    <img src="${it.url||''}" alt="ใบเสร็จ">
    <div>
      <div class="grid">
        <div><label>วันที่</label><input type="date" data-k="date" value="${it.f.date}"></div>
        <div><label>ยอด (บาท)</label><input inputmode="decimal" data-k="amount" value="${it.f.amount}"></div>
        <div class="full"><label>ร้านค้า</label><input data-k="shop" value="${esc(it.f.shop)}"></div>
        <div><label>หมวดหมู่</label><select data-k="cat">${CATS.map(c=>`<option${c===it.f.cat?' selected':''}>${c}</option>`).join('')}</select></div>
        <div><label>หมายเหตุ</label><input data-k="note" value="${esc(it.f.note)}"></div>
      </div>
      ${it.pct<100&&!it.cls?`<div class="bar"><i style="width:${it.pct}%"></i></div>`:''}
      <div class="status ${it.cls}">${it.status}</div>
      <div class="actions">
        <button class="primary" data-act="save" ${it.saved||it.pct<100&&!it.cls?'disabled':''}>${it.saved?'บันทึกแล้ว':'บันทึกลง Drive'}</button>
        <button data-act="del">ลบ</button>
      </div>
    </div>
  </div>`).join('')||'';
}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
$('#list').addEventListener('change',e=>{
  const card=e.target.closest('.item');if(!card||!e.target.dataset.k)return;
  items.find(i=>i.id==card.dataset.id).f[e.target.dataset.k]=e.target.value;
});
$('#list').addEventListener('click',async e=>{
  const act=e.target.dataset.act;if(!act)return;
  const card=e.target.closest('.item'),it=items.find(i=>i.id==card.dataset.id);
  card.querySelectorAll('[data-k]').forEach(el=>it.f[el.dataset.k]=el.value);
  if(act==='del'){items=items.filter(i=>i!==it);render();return}
  const f=it.f;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(f.date)){it.status='ระบุวันที่ให้ถูกต้อง';it.cls='err';render();return}
  it.status='กำลังบันทึกลง Drive…';it.cls='';it.pct=100;render();
  try{
    const [y,m]=f.date.split('-');
    const safe=(f.shop||'ไม่ระบุ').replace(/[\\/:*?"<>|]/g,'').slice(0,30);
    const rootId=await ensureFolder($('#root').value.trim()||'ใบเสร็จ');
    const mId=await ensureFolder(m,await ensureFolder(y,rootId));
    const up=await uploadImage(it.blob,`${f.date}_${safe}_${f.amount||0}.jpg`,mId);
    const sid=await ensureSheet(rootId);
    await appendRow(sid,[f.date,f.shop,parseFloat(f.amount)||0,f.cat,f.note,up.webViewLink,new Date().toLocaleString('th-TH')]);
    it.saved=true;it.status=`บันทึกแล้วที่ ${$('#root').value||'ใบเสร็จ'}/${y}/${m}`;it.cls='ok';
  }catch(err){it.status=err.message;it.cls='err'}
  render();
});
const drop=$('#drop'),fin=$('#file');
drop.onclick=()=>fin.click();
drop.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fin.click()}};
fin.onchange=()=>{addFiles(fin.files);fin.value=''};
['dragover','dragenter'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove('over')}));
drop.addEventListener('drop',e=>addFiles(e.dataTransfer.files));
</script>
</body>
</html>
